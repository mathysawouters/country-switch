<!doctype html><meta charset="utf-8"><title>Country Switch</title>
<style>
html,body{margin:0;height:100%;background:#0b0d0c;color:#f2f4f3;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw}
.k{color:#2fe07a;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:20px;margin-bottom:22px}
h1{font-size:68px;line-height:1.08;margin:0;font-weight:800;letter-spacing:-.03em}
p{font-size:30px;color:#aab3ae;margin:26px 0 0;line-height:1.35}
.f{font-size:92px;margin-bottom:18px;letter-spacing:.12em}
b{color:#2fe07a}
</style>
<div class="w"><div class="f" id="f"></div><div class="k" id="k"></div><h1 id="h"></h1><p id="p"></p></div>
<script>
const q=new URLSearchParams(location.search);for(const k of ['f','k','h','p']){const v=q.get(k);const e=document.getElementById(k);if(v)e.innerHTML=v;else e.remove();}
</script>
